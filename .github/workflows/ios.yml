# Builds the iPhone app on GitHub's macOS runners, so nobody needs a Mac.
#   Every push and pull request: the GhostCore gate (contract/validate.sh: Swift tests, TypeScript
#   checks, unsigned iOS build). Every push also leaves an unsigned .ipa under Artifacts, for
#   sideloading with a free Apple ID (no STUHI access needed).
#   Actions → "iOS app" → Run workflow on main: the gate, then a signed Release build uploaded to
#   TestFlight (other branches run the gate only).
#   Testers in the internal group get it in the TestFlight app once Apple has processed it.
# The upload needs three repository secrets (Settings → Secrets and variables → Actions), from an
# App Store Connect API team key with the Admin role (Users and Access → Integrations):
#   ASC_KEY_ID      the key's ID
#   ASC_ISSUER_ID   the issuer ID shown above the key list
#   ASC_KEY_P8      the full text of the downloaded AuthKey_<ID>.p8 file
# Before the archive, ios-keys.yml signs in to Apple with them; run "iOS signing key" alone to check
# the key without uploading.
name: iOS app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces an older gate run on the same branch, but never interrupts an upload: a
# second "Run workflow" waits for the first to finish.
concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  gate:
    name: Gate (tests and unsigned iOS build)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: GhostCore gate
        env:
          GHOSTCORE_LOGS: ${{ runner.temp }}/gate
        run: sh contract/validate.sh
      - name: Keep the gate logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs
          path: ${{ runner.temp }}/gate/*.log

  # An unsigned Release .ipa for sideloading from Windows with a free Apple ID (Sideloadly), for
  # anyone without access to STUHI's TestFlight. Download it from the run page, under Artifacts.
  ipa:
    name: Unsigned IPA (for sideloading)
    needs: gate
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build (Release, unsigned)
        working-directory: ios
        run: |
          xcodegen
          xcodebuild -project MeshMapper.xcodeproj -scheme MeshMapper -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CURRENT_PROJECT_VERSION="$((100 + BUILD_NUMBER))" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package the .ipa
        run: |
          wire=$(grep -o 'static let version = [0-9]*' ios/MeshCore/Sources/MeshCore/Models.swift | grep -o '[0-9]*$')
          name="MeshMapper-build$((100 + BUILD_NUMBER))-wire$wire-${GITHUB_SHA::7}"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/MeshMapper.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$name.ipa" Payload)
          echo "IPA_NAME=$name" >> "$GITHUB_ENV"
          {
            echo "### $name.ipa"
            echo "Unsigned. Install from Windows with Sideloadly and a free Apple ID (HANDOVER.md). Every phone that should link needs a build with the same wire version (v$wire)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ runner.temp }}/ipa/${{ env.IPA_NAME }}.ipa
          retention-days: 30

  # Signs in to Apple with the API key first, so a missing, wrong or revoked key fails in a minute
  # instead of after the archive.
  key:
    name: API key
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ios-keys.yml
    secrets: inherit

  testflight:
    name: Upload to TestFlight
    needs: [gate, key]
    # Only main goes to TestFlight: internal testers install every upload automatically.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      # TestFlight needs a higher build number every upload; Mac uploads stopped at 13.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write the API key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "BUILD=$((100 + BUILD_NUMBER))" >> "$GITHUB_ENV"
      - name: Archive (Release, signed by Xcode with the API key)
        working-directory: ios
        run: |
          xcodegen
          xcodebuild -project MeshMapper.xcodeproj -scheme MeshMapper -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/MeshMapper.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive
      - name: Upload to TestFlight
        working-directory: ios
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MeshMapper.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Summary
        run: |
          wire=$(grep -o 'static let version = [0-9]*' ios/MeshCore/Sources/MeshCore/Models.swift | grep -o '[0-9]*$')
          {
            echo "### Build $BUILD uploaded to TestFlight"
            echo "Commit \`${GITHUB_SHA::7}\`, wire v$wire. Apple processes it for a few minutes; then it appears in the TestFlight app."
            echo "Every phone that should link needs this same build."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
