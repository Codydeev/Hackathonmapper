name: MeshMapper
options:
  bundleIdPrefix: com.hackathonmapper
  deploymentTarget:
    iOS: '17.0'
packages:
  MeshCore:
    path: MeshCore
targets:
  MeshMapper:
    type: application
    platform: iOS
    sources:
      - path: MeshMapper
        excludes:
          - "**/*.md"
      # GhostCore scenarios (S0-S6) for the in-app scenario player.
      - path: ../contract/scenarios
        buildPhase: resources
        includes:
          - "*.json"
    dependencies:
      - package: MeshCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackathonmapper.MeshMapper
        DEVELOPMENT_TEAM: Q485H7YK66 # STUHI (Nuorten startup- ja innovaatioyhdistys ry), needed for TestFlight
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 11 # bump for every TestFlight upload; 8-9 skipped (all-work used them)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MeshMapper/Info.plist
    scheme:
      testTargets: []
