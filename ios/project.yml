name: MeshMapper
options:
  bundleIdPrefix: com.hackathonmapper
  deploymentTarget:
    iOS: '17.0'
packages:
  MeshCore:
    path: MeshCore
targets:
  MeshMapper:
    type: application
    platform: iOS
    sources:
      - MeshMapper
    dependencies:
      - package: MeshCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackathonmapper.MeshMapper
        DEVELOPMENT_TEAM: Q485H7YK66 # STUHI (Nuorten startup- ja innovaatioyhdistys ry), needed for TestFlight
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 2 # bump for every TestFlight upload
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MeshMapper/Info.plist
    scheme:
      testTargets: []
