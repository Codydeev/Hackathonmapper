# Builds and tests the Android app (android/) on every push and pull request, and leaves an
# installable APK under the run's Artifacts ("MeshMapper-android"): download it on the phone, or
# on a computer and install with `adb install -r`. See HANDOVER.md, "Android phones".
# The APK is signed with the runner's fresh debug key, so a phone holding a build from another
# run or machine must uninstall MeshMapper before installing this one (Android refuses an update
# signed with a different key).
name: Android app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests and APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: MeshCore tests (shared fixtures, signal-map golden, wire vectors)
        run: ./gradlew :meshcore:test --console=plain
      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Build the APK
        run: ./gradlew :app:assembleDebug :app:lintDebug --console=plain
      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: MeshMapper-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/meshcore/build/reports/tests/
            android/app/build/reports/
